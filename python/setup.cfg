[mypy]
files = pack_python.py, pack_wheel.py, pack_wheel-deb.py, pack_fpm-deb.py, pack_dh-virtualenv.py, pack_common.py
strict = True
scripts_are_modules = True


[flake8]
exclude = build,dist
max-line-length = 120
max-complexity = 14
count = True
statistics = True
show-source = True
per-file-ignores =
# F401: imported but unused
# F403: import * used; unable to detect undefined names
    __init__.py: F401,F403
# E402: module level import not at top of file
    pack_python.py: E402
    pack_wheel.py: E402
# W293: blank line contains whitespace
    pack_wheel-deb.py: E402,W293
    pack_fpm-deb.py: E402
    pack_dh-virtualenv.py: E402

[tool:pytest]
addopts = --capture=no --verbose
python_files = *Test.py
python_classes = *Test

[coverage:run]
relative_files = true
branch = True

[coverage:report]
; Regexes for lines to exclude from consideration
exclude_also =
; Don't complain about missing debug-only code:
    def __repr__
    if self\.debug

; Don't complain if tests don't hit defensive assertion code:
    raise AssertionError
    raise NotImplementedError

; Don't complain if non-runnable code isn't run:
    if 0:
    if __name__ == .__main__.:

; Don't complain about abstract methods, they aren't run:
    @(abc\.)?abstractmethod

ignore_errors = True
skip_empty = True

[coverage:html]
directory = coverage/html

[coverage:json]
output = coverage/coverage.json
